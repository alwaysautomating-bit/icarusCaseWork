[project]
name = "icarus-court-packet-parser"
version = "0.1.0"
description = "Page-grounded LlamaParse ingestion for Icarus Casework court packets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "llama-cloud==2.14.1",
]

[project.scripts]
icarus-packet = "icarus_court_packet.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/icarus_court_packet"]

[tool.pytest.ini_options]
testpaths = ["tests"]

